services:
  homebox:
    image: ghcr.io/gedoy9793/homebox:main
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - COMMIT=head
        - BUILD_TIME=0001-01-01T00:00:00Z
      x-bake:
        platforms:
            - linux/amd64
            - linux/arm64
            - linux/arm
    environment:
      - HBOX_LOGGER_LEVEL=-1
      - HBOX_IMAGE_SEARCH_URL=http://image-search:8080
      # Avoid file:/// + prefix=data (fileblob treats "/" root as escaping).
      - HBOX_STORAGE_CONN_STRING=file:///data?no_tmp_dir=true
      - HBOX_STORAGE_PREFIX_PATH=
    ports:
      - 3100:7745
    volumes:
      - homebox-data:/data
    depends_on:
      - image-search

  image-search:
    image: ghcr.io/gedoy9793/homebox-image-search:main
    build: ./services/image-search
    environment:
      # dinov2_vits14 | dinov2_vitb14 | dinov2_vitl14 | dinov2_vitg14
      - IMAGE_SEARCH_MODEL=dinov2_vitg14
    volumes:
      - image-search-data:/var/lib/image-search
    # No host ports: reachable only on the compose network.

volumes:
  homebox-data:
  image-search-data:
