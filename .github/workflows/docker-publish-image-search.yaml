name: Docker publish (image-search)

# Publishes the DINOv2+FAISS sidecar to our GHCR namespace. Kept separate from
# docker-publish-fork so upstream merges stay conflict-free and so a heavy
# Python/model rebuild is not coupled to every Homebox API change.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms. arm64 builds under QEMU and is very slow.'
        required: false
        default: 'linux/amd64'
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/arm64'
          - 'linux/amd64,linux/arm64'
      tag:
        description: 'Extra image tag to apply (optional, e.g. test1)'
        required: false
        default: ''
  push:
    branches: [ 'main' ]
    paths:
      - 'services/image-search/**'
      - '.github/workflows/docker-publish-image-search.yaml'

env:
  # Must be lowercase: docker rejects image names containing uppercase letters.
  IMAGE: ghcr.io/gedoy9793/homebox-image-search

concurrency:
  group: docker-publish-image-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up QEMU
        if: contains(github.event.inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      # Registry buildcache + attestations create many GHCR blob uploads and
      # frequently trip secondary rate limits on free accounts (403 while the
      # image layers themselves already built). Prefer GHA cache; skip attestations.
      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./services/image-search
          file: ./services/image-search/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-search
          cache-to: type=gha,scope=image-search,mode=max

      - name: Summary
        run: |
          echo "### Pushed images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
